<!DOCTYPE html>
<html class="ab-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Graph explorer</title>
<link href="css/graph_theme.css?v=2" rel="stylesheet" type="text/css" />
<style>
html, body {
    width: 100%; height: 100%; margin: 0; padding: 0;
    background: var(--ab-graph-bg); color: var(--ab-graph-text);
    overflow: hidden; position: relative; font-family: sans-serif;
}
svg.canvas { width: 100%; height: 100%; display: block; }
.node { fill: var(--ab-graph-text); }
.node rect { stroke: var(--ab-graph-stroke); fill: var(--ab-graph-node-fill); stroke-width: 3px; }
.node.center rect, .node.demand rect { stroke: var(--ab-graph-demand); stroke-width: 4px; }
.node.selected rect { stroke: var(--ab-graph-minimap-viewport); }
.node text, .node text tspan {
    fill: var(--ab-graph-text);
    font-family: sans-serif;
    font-size: 12px;
    pointer-events: none;
}
.node text tspan.ab-loc { fill: var(--ab-graph-muted); }
.node text.ab-multi {
    font-weight: 700;
    font-size: 13px;
    pointer-events: none;
}
.edgePath path {
    fill: none;
    stroke: var(--ab-graph-edge-label);
    stroke-width: 1.5px;
    opacity: 1;
    marker-end: url(#ge-arrow-blue);
    pointer-events: stroke;
}
.edgePath.waste path { stroke-dasharray: 5 3; }
.edgePath.hot path { stroke-width: 3.5px; }
.edgePath.functional path {
    stroke: #c62828;
    stroke-width: 3px;
    marker-end: url(#ge-arrow-red);
}
.edgePath.functional.hot path { stroke-width: 5px; }
.edgePath.substitution path {
    stroke: #2e7d32;
    marker-end: url(#ge-arrow-green);
}
.edgePath.substitution.hot path { stroke-width: 3.5px; }
.edgePath.functional.waste path { stroke-dasharray: 5 3; }
.edgePath.functional text, .edgePath.functional tspan,
g.edgeLabel.functional text, g.edgeLabel.functional tspan {
    fill: #c62828;
}
.node.remainder rect {
    fill: var(--ab-graph-node-fill);
    stroke: var(--ab-graph-muted);
    stroke-width: 2px;
    stroke-dasharray: 6 4;
}
.node.remainder text, .node.remainder text tspan {
    fill: var(--ab-graph-muted);
    font-size: 12px;
}
.edgePath.remainder path {
    stroke: var(--ab-graph-muted);
    stroke-dasharray: 6 4;
    marker-end: none;
}
.edgePath.stub { cursor: pointer; }
.func-dot { fill: #111111; stroke: none; pointer-events: none; }
.ctrl { fill: var(--ab-graph-triangle); cursor: pointer; stroke: none; }
g.edgeLabel { pointer-events: all; }
g.edgeLabel text, g.edgeLabel tspan, .edgeLabel, .edge-label {
    fill: var(--ab-graph-edge-label);
    font-family: sans-serif;
    font-size: 11px;
}
#tooltip {
    position: absolute;
    pointer-events: none;
    max-width: min(320px, calc(100vw - 16px));
    padding: 7px 9px;
    border-radius: 4px;
    font: 11px/1.4 sans-serif;
    background: var(--ab-graph-tooltip-bg);
    color: var(--ab-graph-tooltip-text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    z-index: 4;
}
#tooltip[hidden] { display: none !important; }
</style>
</head>
<body>
<svg id="canvas" class="canvas"></svg>
<div id="tooltip" hidden></div>
<script src="javascript/d3.js"></script>
<script src="javascript/dagre.js"></script>
<script src="javascript/dagre-d3.js"></script>
<script src="javascript/sankey_graph_style.js?v=13"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="javascript/graph_explorer.js?v=35"></script>
</body>
</html>
