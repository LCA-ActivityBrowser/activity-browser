# Present on the default branch (main) so GitHub Actions can show
# "Run workflow". When you run it, pick major (or a PR branch with the full
# Release Stand-alone workflow) in the branch dropdown.
name: Release Stand-alone

on:
  workflow_dispatch:

jobs:
  select-branch-note:
    runs-on: ubuntu-latest
    steps:
      - name: Reminder
        run: |
          echo "If you ran this against 'main', re-run and select 'major'"
          echo "(or a feature branch that contains the full Release Stand-alone workflow)."
          echo "That workflow publishes the public 'stand-alone' GitHub Release."
