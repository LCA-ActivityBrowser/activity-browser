name: Release Stand-alone

# Promote a successful Build Executable run to immutable versioned GitHub
# Releases tagged `{AB}-stand-alone` (see ADR-0015). Docs link to the Releases
# page; the in-app update checker finds the newest `*-stand-alone` tag via API.
#
# Manual only. A minimal workflow_dispatch stub with the same name must exist
# on main so Actions shows "Run workflow"; pick major (or this PR branch) in
# the dropdown so GitHub uses this full workflow file.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build Executable run ID (empty = latest success on source_branch)"
        required: false
        type: string
      source_branch:
        description: "Branch used to find the latest Build Executable run when build_run_id is empty"
        required: true
        default: "major"
        type: string
      ab_version:
        description: "AB version shown in release notes (empty = PyPI latest)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve AB version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.ab_version }}" ]]; then
            BASE="${{ inputs.ab_version }}"
          else
            BASE="$(python -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("https://pypi.org/pypi/activity-browser/json"))["info"]["version"])')"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "display=${BASE}-stand-alone" >> "$GITHUB_OUTPUT"

      - name: Resolve Build Executable run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.build_run_id }}" ]]; then
            RUN_ID="${{ inputs.build_run_id }}"
          else
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Build Executable" \
              --branch "${{ inputs.source_branch }}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
            if [[ -z "${RUN_ID}" || "${RUN_ID}" == "null" ]]; then
              echo "No successful Build Executable run found on ${{ inputs.source_branch }}" >&2
              echo "Tip: use a run from a merged PR to major, or paste build_run_id explicitly." >&2
              exit 1
            fi
          fi
          echo "id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "Using Build Executable run ${RUN_ID}"
          gh run view "${RUN_ID}" --repo "${{ github.repository }}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.id }}
          path: artifacts
          merge-multiple: true

      - name: Prepare versioned assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob

          win=(artifacts/*-windows-x64-setup.exe)
          mac=(artifacts/*-macos-arm64.dmg)
          linux=(artifacts/*-linux-x86_64.AppImage)
          deps=(artifacts/*-dependencies.txt)

          if [[ ${#win[@]} -ne 1 || ${#mac[@]} -ne 1 || ${#linux[@]} -ne 1 ]]; then
            echo "Expected one installer per platform; found:" >&2
            find artifacts -type f -print >&2
            exit 1
          fi

          DISPLAY_VER="${{ steps.ver.outputs.display }}"

          cp -f "${win[0]}" "release-assets/ActivityBrowser-${DISPLAY_VER}-windows-x64-setup.exe"
          cp -f "${mac[0]}" "release-assets/ActivityBrowser-${DISPLAY_VER}-macos-arm64.dmg"
          cp -f "${linux[0]}" "release-assets/ActivityBrowser-${DISPLAY_VER}-linux-x86_64.AppImage"

          for f in "${deps[@]}"; do
            cp -f "$f" "release-assets/$(basename "$f")"
          done

          ls -la release-assets

      - name: Publish versioned stand-alone Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.display }}"
          TITLE="Activity Browser stand-alone (${TAG})"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          NOTES="$(cat <<EOF
          ### Downloads

          - [Windows](${BASE_URL}/ActivityBrowser-${TAG}-windows-x64-setup.exe)
          - [macOS (Apple Silicon)](${BASE_URL}/ActivityBrowser-${TAG}-macos-arm64.dmg)
          - [Linux](${BASE_URL}/ActivityBrowser-${TAG}-linux-x86_64.AppImage)

          Stand-alone installers for Activity Browser **${TAG}**
          (matches PyPI/conda AB **${{ steps.ver.outputs.base }}**, packaged without a local Python install).

          Built from [Build Executable run ${{ steps.run.outputs.id }}](https://github.com/${REPO}/actions/runs/${{ steps.run.outputs.id }}).

          ### Notes

          - If you are looking for an older stand-alone version, see releases with a tag ending in \`-stand-alone\` below.
          - Windows builds are **not code-signed** (SmartScreen / browser warnings are common).
          - macOS builds are **not notarized** (Control-click → Open on first launch).
          EOF
          )"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber" >&2
            gh release upload "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest=false
          else
            gh release create "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest=false
          fi

          echo "Published https://github.com/${{ github.repository }}/releases/tag/${TAG}"
