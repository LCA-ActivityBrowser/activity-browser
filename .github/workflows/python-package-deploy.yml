---
# Inspired from:
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish release to PyPI and Anaconda

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match an existing tag, e.g. 3.0.1)"
        required: true
        type: string
      targets:
        description: "Publish targets"
        required: true
        type: choice
        options:
          - both
          - pypi
          - conda
        default: conda

jobs:
  publish-pypi:
    name: Publish to PyPI
    # Stand-alone promotes use tags ending in -stand-alone; do not publish those here.
    if: >-
      ${{
        !endsWith(
          github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name,
          '-stand-alone'
        ) && (
          github.event_name == 'push' ||
          inputs.targets == 'both' ||
          inputs.targets == 'pypi'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: "0"
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
    - name: Set version
      run: echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      env:
        VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --outdir dist/
        .
    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: false
        # Safe for job re-runs / manual dispatch after a partial success
        skip-existing: true

  publish-conda:
    name: Publish to Anaconda (lca)
    # Stand-alone promotes use tags ending in -stand-alone; do not publish those here.
    if: >-
      ${{
        !endsWith(
          github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name,
          '-stand-alone'
        ) && (
          github.event_name == 'push' ||
          inputs.targets == 'both' ||
          inputs.targets == 'conda'
        )
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: "0"
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
    - name: Set version
      run: echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      env:
        VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    - name: Set up Conda 3.11
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: 3.11
        activate-environment: build
        environment-file: .github/conda-envs/build.yml
        conda-build-version: "*"
    - name: Build a Conda package
      env:
        VERSION: ${{ env.VERSION }}
      run: |
        echo "Building conda package with VERSION=${VERSION}"
        conda build -c conda-forge -c cmutel -c lca ./packaging/conda/
    - name: Publish to Anaconda (lca)
      run: |
        anaconda -t ${{ secrets.CONDA_LCA }} upload \
        "$CONDA/conda-bld/noarch/"*.conda
