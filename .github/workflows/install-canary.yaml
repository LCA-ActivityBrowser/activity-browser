name: canary installation
on:
  schedule:
    # Published install-channel check daily; Automated Testing schedule is 08:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

# Sparse matrix (4+4 per installer): all supported Pythons on Ubuntu; oldest+newest
# on Windows and one ARM macOS. Validates published pip (PyPI) and conda (lca)
# install channels only — not source tip / pytest (see testing.yaml).

jobs:
  canary-installs-pip:
    timeout-minutes: 12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install activity-browser from PyPI
        run: |
          python -m pip install activity-browser
      - name: Environment info
        run: |
          pip freeze
          pip freeze > requirements.txt
      - name: Upload frozen environment as artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-${{ matrix.os }}-${{ matrix.python-version }}
          path: requirements.txt

  canary-installs-conda:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          generate-run-shell: true
          condarc: |
            channels:
              - conda-forge
              - lca
              - cmutel
            channel_priority: flexible
      - name: Install activity-browser from lca
        # Mirrors docs `conda create … lca::activity-browser python=…`; micromamba for CI solve speed
        run: |
          micromamba create -y -n ab \
            -c conda-forge -c lca -c cmutel \
            lca::activity-browser \
            "python=${{ matrix.python-version }}"
      - name: Environment info
        run: |
          micromamba list -n ab --export
          micromamba list -n ab --export > conda-env.txt
      - name: Upload frozen environment as artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-env-${{ matrix.os }}-${{ matrix.python-version }}
          path: conda-env.txt
