name: Automated Testing
on:
  pull_request:
    branches:
      - beta
      - major
  push:
    branches:
      - major

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-latest]
        py-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: 'offscreen'
      # File + grep-friendly [test-duration] lines (see tests/duration_logging.py).
      AB_TEST_DURATION_LOG: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.py-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py-version }}

      - name: Install linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: tlambert03/setup-qt-libs@v1

      - name: Update pip & install testing pkgs
        run: |
          python -VV
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package and test deps
        run: |
          pip install .[testing]

      - name: Test with pytest
        run: >
          pytest -q --no-cov -o log_cli=false
          --durations=50
          --junitxml=pytest-junit.xml

      - name: Upload test duration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ matrix.os }}-${{ matrix.py-version }}
          path: |
            test-durations.tsv
            pytest-junit.xml
          if-no-files-found: warn
          retention-days: 14
