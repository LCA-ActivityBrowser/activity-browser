name: Automated Testing
on:
  pull_request:
    branches:
      - beta
      - major
  push:
    branches:
      - major

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-latest]
        py-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: 'offscreen'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.py-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py-version }}

      - name: Install linux dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: tlambert03/setup-qt-libs@v1

      - name: Update pip & install testing pkgs
        run: |
          python -VV
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package and test deps
        run: |
          pip install .[testing]

      - name: Test with pytest
        run: pytest -q --no-cov -o log_cli=false --durations=25

  # Dual-support guard: default matrix resolves toward pandas 3.x after the <4 pin;
  # keep one job on latest pandas 2.x so 2.x does not rot (ADR-0014).
  tests-pandas2:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: 'offscreen'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linux dependencies
        uses: tlambert03/setup-qt-libs@v1

      - name: Update pip & install testing pkgs
        run: |
          python -VV
          python -m pip install --upgrade pip setuptools wheel

      - name: Install package and test deps
        run: |
          pip install .[testing]
          pip install "pandas>=2.2.1,<3"

      - name: Show pandas version
        run: python -c "import pandas; print(pandas.__version__)"

      - name: Test with pytest
        run: pytest -q --no-cov -o log_cli=false --durations=25
