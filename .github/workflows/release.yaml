name: stable release
on:
  push:
    tags:
      - "*"

jobs:
  release:
    # Stand-alone promotes use tags ending in -stand-alone; skip GitHub Release/wiki for those.
    if: ${{ !endsWith(github.ref_name, '-stand-alone') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - name: Create github release
        uses: ncipollo/release-action@v1
        with:
          # Uses GitHub native notes categorized by .github/release.yml (on the default branch)
          generateReleaseNotes: true
          commit: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update wiki
        run: ./.github/scripts/update_wiki.sh "Automated documentation update for $GITHUB_REF_NAME" "${{ secrets.GITHUB_TOKEN }}"
