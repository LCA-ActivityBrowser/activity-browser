name: Activity Browser 3
description: File a bug report or feature request.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Activity Browser. Please include enough detail to reproduce bugs (version, install channel, OS, and steps). Feature requests are welcome too.
  - type: textarea
    id: what-happened
    attributes:
      label: What do you want to report?
      description: Also tell us what you expected to happen. You can share relevant files (e.g. screenshots) here too.
      placeholder: Tell us what happened
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Relevant errors
      description: Please copy and paste any relevant errors from the terminal.
      placeholder: This will be automatically formatted into code, so no need to worry about the formatting.
      render: python
  - type: input
    id: version
    attributes:
      label: Version
      description: Please specify the version of the Activity Browser you are using.
      placeholder: e.g. 3.0.0 (from About / pip show)
  - type: dropdown
    id: distribution
    attributes:
      label: Installation method
      multiple: false
      options:
        - PyPI (pip)
        - Anaconda (conda / lca)
        - Stand-alone
      default: 0
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: false
      options:
        - Windows 10
        - Windows 11
        - MacOS (Apple Silicon)
        - MacOS (Intel)
        - Linux/Other (please specify above)
      default: 1
